name: psito_cell
description: "A cozy solitaire card game with cockatiels. No ads, no telemetry, no account."
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/cards/
    - assets/mascot/
